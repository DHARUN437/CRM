name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Native Web Assets
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
            <title>JoyCRM Mobile</title>
            <style>
              body { background: #0A0A0F; color: #F4F4F6; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
              .spinner { width: 44px; height: 44px; border: 4px solid #2A2A38; border-top-color: #818CF8; border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 16px; }
              @keyframes spin { to { transform: rotate(360deg); } }
              .text { font-size: 16px; font-weight: 600; color: #9797A8; }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <div class="text">Connecting to JoyCRM...</div>
            <script>
              setTimeout(function() {
                var target = "https://crm.speardigital.in";
                if (window.location.href !== target) {
                  window.location.replace(target);
                }
              }, 300);
            </script>
          </body>
          </html>
          EOF
          export CAPACITOR_SERVER_URL="https://crm.speardigital.in"
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyCRM-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
