<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download JoyCRM Mobile App</title>
  <style>
    :root {
      --bg-base: #0A0A0F;
      --bg-card: #17171F;
      --bg-hover: #1E1E28;
      --border-subtle: #2A2A38;
      --text-primary: #F4F4F6;
      --text-secondary: #9797A8;
      --accent-primary: #818CF8;
      --accent-glow: rgba(99, 102, 241, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .app-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366F1, #818CF8);
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--accent-glow);
    }
    .app-icon svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .version {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-primary);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--accent-primary);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .download-btn:hover {
      background: #6366F1;
      transform: translateY(-2px);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #6E6E80;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-icon">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </div>
    <h1>JoyCRM Mobile</h1>
    <div class="version">v1.0.0 · Android APK</div>
    <p>Manage projects, tasks, client communication, and team workload on the go with live notifications and real-time updates.</p>
    <a href="/download/JoyCRM.apk" class="download-btn" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download APK (Android)
    </a>
    <div class="footer-note">Compatible with Android 8.0+ (API 24+)</div>
  </div>
</body>
</html>
